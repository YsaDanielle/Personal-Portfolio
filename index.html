<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ysa Danielle Atienza | Portfolio</title>
    <meta
      name="description"
      content="A modern portfolio for Ysa Danielle Atienza, a BSCS student focused on design, development, and thoughtful digital experiences."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if (localStorage.getItem("ysa-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script>
      tailwind = window.tailwind || {};
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              lilac: "#f6f1ff",
              ink: "#2b2238",
              lavender: "#eadfff",
              orchid: "#a176d8",
              plum: "#6f4fa3",
              deep: "#241733",
              mist: "#fbf8ff",
              dusk: "#140f1f"
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
              display: ["Fraunces", "serif"]
            },
            boxShadow: {
              soft: "0 18px 60px rgba(111, 79, 163, 0.14)",
              card: "0 12px 40px rgba(111, 79, 163, 0.12)"
            },
            backgroundImage: {
              grain:
                "radial-gradient(circle at top left, rgba(255,255,255,0.92), transparent 34%), radial-gradient(circle at 85% 10%, rgba(161,118,216,0.2), transparent 24%), radial-gradient(circle at 50% 100%, rgba(111,79,163,0.16), transparent 30%)"
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-10px)" }
              },
              fadeUp: {
                "0%": { opacity: "0", transform: "translateY(24px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            },
            animation: {
              float: "float 7s ease-in-out infinite",
              fadeUp: "fadeUp 0.8s ease forwards"
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --text-primary: #3c2a59;
        --text-secondary: #5d4b79;
        --text-muted: #7c6a97;
        --text-inverse: #f7f1ff;
        --surface: rgba(255, 255, 255, 0.74);
        --surface-strong: #f5eeff;
        --surface-soft: #fbf7ff;
        --surface-deep: #3f2b62;
        --surface-glass: rgba(255, 255, 255, 0.68);
        --border-soft: rgba(146, 111, 196, 0.22);
        --feature-panel: linear-gradient(135deg, #eee4ff 0%, #decdf8 48%, #ccb3f1 100%);
        --feature-panel-text: #3f2b62;
        --feature-panel-copy: rgba(63, 43, 98, 0.82);
        --feature-panel-label: rgba(63, 43, 98, 0.58);
        --contact-panel: linear-gradient(135deg, #eadcff 0%, #dac3fb 44%, #bb9cea 100%);
        --contact-card: rgba(255, 255, 255, 0.26);
        --contact-card-border: rgba(120, 87, 177, 0.18);
        --contact-pill-border: rgba(120, 87, 177, 0.22);
        --contact-pill-hover-bg: rgba(255, 255, 255, 0.72);
        --contact-pill-hover-text: #3f2b62;
        --modal-panel: linear-gradient(90deg, #f5eeff 0%, #f5eeff 18%, #ebe1fb 38%, #d6c2f3 58%, #b18de1 78%, #805db8 100%);
        --modal-panel-soft: rgba(255, 255, 255, 0.12);
        --modal-panel-text: #3f2b62;
        --modal-panel-text-soft: rgba(63, 43, 98, 0.8);
        --modal-panel-label: rgba(63, 43, 98, 0.58);
        --modal-panel-button-bg: rgba(255, 255, 255, 0.22);
        --modal-panel-button-border: rgba(255, 255, 255, 0.34);
        --button-primary: linear-gradient(135deg, #8e6ad0 0%, #6f4fa3 55%, #5d4191 100%);
        --button-primary-hover: linear-gradient(135deg, #9c79dc 0%, #7b58b3 55%, #69489f 100%);
        --button-primary-text: #ffffff;
        --button-ghost: rgba(255, 255, 255, 0.78);
        --button-ghost-hover: #f2e9ff;
        --button-ghost-text: #3c2a59;
        --social-orb-bg: #3f2b62;
        --social-orb-text: #ffffff;
        --social-orb-hover: #6f4fa3;
      }

      html.dark {
        --text-primary: #f5edff;
        --text-secondary: #dccccf;
        --text-muted: #b9a8d0;
        --text-inverse: #140f1f;
        --surface: rgba(255, 255, 255, 0.06);
        --surface-strong: #241833;
        --surface-soft: rgba(255, 255, 255, 0.05);
        --surface-deep: #2a1c3b;
        --surface-glass: rgba(33, 23, 47, 0.78);
        --border-soft: rgba(255, 255, 255, 0.1);
        --feature-panel: linear-gradient(135deg, #38204f 0%, #4c2e73 52%, #5c3891 100%);
        --feature-panel-text: #ffffff;
        --feature-panel-copy: rgba(255, 255, 255, 0.82);
        --feature-panel-label: rgba(255, 255, 255, 0.58);
        --contact-panel: linear-gradient(135deg, #1c122b 0%, #29163f 48%, #3b1f5d 100%);
        --contact-card: rgba(255, 255, 255, 0.05);
        --contact-card-border: rgba(255, 255, 255, 0.1);
        --contact-pill-border: rgba(255, 255, 255, 0.1);
        --contact-pill-hover-bg: #f3eaff;
        --contact-pill-hover-text: #2b1b3f;
        --modal-panel: linear-gradient(90deg, #241833 0%, #2d1c42 35%, #3d265c 68%, #563784 100%);
        --modal-panel-soft: rgba(255, 255, 255, 0.08);
        --modal-panel-text: #ffffff;
        --modal-panel-text-soft: rgba(255, 255, 255, 0.8);
        --modal-panel-label: rgba(255, 255, 255, 0.55);
        --modal-panel-button-bg: rgba(255, 255, 255, 0.1);
        --modal-panel-button-border: rgba(255, 255, 255, 0.2);
        --button-primary: linear-gradient(135deg, #f8f0ff 0%, #ecdfff 55%, #e0ccff 100%);
        --button-primary-hover: linear-gradient(135deg, #ffffff 0%, #f1e5ff 55%, #e7d7ff 100%);
        --button-primary-text: #241733;
        --button-ghost: rgba(255, 255, 255, 0.06);
        --button-ghost-hover: rgba(255, 255, 255, 0.12);
        --button-ghost-text: #f5edff;
        --social-orb-bg: #f3eaff;
        --social-orb-text: #241733;
        --social-orb-hover: #ffffff;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background:
          linear-gradient(180deg, #fcfaff 0%, #f7f2ff 45%, #f4efff 100%);
        color: #2b2238;
        transition: background 0.3s ease, color 0.3s ease;
      }

      html.dark body {
        background:
          radial-gradient(circle at top center, rgba(123, 85, 191, 0.2), transparent 30%),
          linear-gradient(180deg, #120d1c 0%, #171122 50%, #1b1329 100%);
        color: #f5edff;
      }

      ::selection {
        background: rgba(161, 118, 216, 0.28);
      }

      .fade-mask {
        mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
      }

      .text-primary {
        color: var(--text-primary) !important;
      }

      .text-secondary {
        color: var(--text-secondary) !important;
      }

      .text-muted {
        color: var(--text-muted) !important;
      }

      .text-inverse {
        color: var(--text-inverse) !important;
      }

      .surface-card {
        background: var(--surface) !important;
        border-color: var(--border-soft) !important;
      }

      .surface-soft {
        background: var(--surface-soft) !important;
        border-color: var(--border-soft) !important;
      }

      .surface-strong {
        background: var(--surface-strong) !important;
      }

      .surface-deep {
        background: var(--surface-deep) !important;
      }

      .surface-glass {
        background: var(--surface-glass) !important;
        border-color: var(--border-soft) !important;
      }

      .surface-feature-panel {
        background: var(--feature-panel) !important;
        color: var(--feature-panel-text) !important;
      }

      .feature-panel-label {
        color: var(--feature-panel-label) !important;
      }

      .feature-panel-copy {
        color: var(--feature-panel-copy) !important;
      }

      .surface-contact-panel {
        background: var(--contact-panel) !important;
        color: var(--feature-panel-text) !important;
      }

      .surface-contact-card {
        background: var(--contact-card) !important;
        border-color: var(--contact-card-border) !important;
      }

      .contact-pill {
        border-color: var(--contact-pill-border) !important;
      }

      .contact-pill:hover {
        background: var(--contact-pill-hover-bg) !important;
        color: var(--contact-pill-hover-text) !important;
      }

      .social-orb {
        background: var(--social-orb-bg) !important;
        color: var(--social-orb-text) !important;
        border-color: transparent !important;
      }

      .social-orb:hover {
        background: var(--social-orb-hover) !important;
      }

      .surface-modal-panel {
        background: var(--modal-panel) !important;
        color: var(--modal-panel-text) !important;
      }

      .surface-modal-soft {
        background: var(--modal-panel-soft) !important;
        border-color: rgba(255, 255, 255, 0.14) !important;
      }

      .modal-panel-heading {
        color: var(--modal-panel-text) !important;
      }

      .modal-panel-copy {
        color: var(--modal-panel-text-soft) !important;
      }

      .modal-panel-label {
        color: var(--modal-panel-label) !important;
      }

      .modal-panel-close {
        background: var(--modal-panel-button-bg) !important;
        border-color: var(--modal-panel-button-border) !important;
        color: var(--modal-panel-text) !important;
      }

      .btn-primary-theme {
        background: var(--button-primary) !important;
        color: var(--button-primary-text) !important;
        border-color: transparent !important;
        box-shadow: 0 12px 28px rgba(111, 79, 163, 0.22);
      }

      .btn-primary-theme:hover {
        background: var(--button-primary-hover) !important;
      }

      .btn-ghost-theme {
        background: var(--button-ghost) !important;
        color: var(--button-ghost-text) !important;
        border-color: var(--border-soft) !important;
      }

      .btn-ghost-theme:hover {
        background: var(--button-ghost-hover) !important;
      }

      .carousel-slide {
        position: absolute;
        inset: 0;
        height: 100%;
        width: 100%;
        object-fit: cover;
        opacity: 0;
        transform: translateX(18px) scale(1.02);
        transition: opacity 0.75s ease, transform 0.75s ease;
      }

      .carousel-slide.is-active {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    </style>
  </head>
  <body class="bg-mist text-ink antialiased">
    <div
      class="hidden text-plum text-ink bg-mist dark:bg-dusk bg-lilac border-orchid/20 border-orchid/30 border-plum/15 border-plum/10 bg-white/80 bg-white/72 bg-white/70 bg-white/65 bg-white/45 bg-white/5 dark:text-white dark:text-[#f7f1ff] dark:text-[#f2e8ff] dark:text-[#eadcff] dark:bg-[#241833]/90 dark:bg-[#21172f]/78 dark:bg-[#2a1c3b] dark:bg-[#241833] dark:bg-[#1d132a] dark:bg-[#261838] dark:from-[#38204f] dark:via-[#4c2e73] dark:to-[#5c3891] dark:from-[#1c122b] dark:via-[#29163f] dark:to-[#3b1f5d] dark:from-[#6d48aa]/40 dark:to-[#43245f]/35 from-[#7f5ab8] via-[#6f4fa3] to-[#5f4294] from-[#2f1d46] via-[#40285f] to-[#55357d] from-[#c9b0f1]/60 via-[#f4ebff] from-[#9f86d8]/50 via-[#efe8ff] from-[#dfc7ff]/70 via-[#f7f2ff] from-[#bba1f0]/60 via-[#efe7ff] from-[#d8c1ff]/70 via-[#f6f0ff] bg-[#f7f2ff] bg-[#f4edff] bg-[#f2eaff] bg-[#f3eaff] bg-[#ccb7f3]/70 bg-[#e3d6ff]/90 bg-[#cdb6f6]/55 dark:bg-[#7b55bf]/30 dark:bg-[#4d2f78]/35 hover:bg-[#5f4294] hover:bg-[#f4edff] hover:text-[#2b1b3f] hover:text-[#f1dfff]">
    </div>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
  </html>
